<script id="vertex-shader" type="x-shader/x-vertex">
attribute vec2 a_position;

void main() {
    gl_Position = vec4(a_position, 0.0, 1.0);
}
</script>

<script id="fragment-shader" type="x-shader/x-fragment">

precision mediump float;

uniform vec2 u_resolution;
uniform float u_time;

vec3 c1 = vec3(241.0, 90.0, 36.0) / 255.0;
vec3 c2 = vec3(61.0, 49.0, 91.0) / 255.0;
vec3 c3 = vec3(65.0, 182.0, 166.0) / 255.0;
vec3 c4 = vec3(122.0, 137.0, 166.0) / 255.0;
vec3 c5 = vec3(94.0, 130.0, 127.0) / 255.0;

void main() {

    vec2 uv = gl_FragCoord.xy / u_resolution.xy;

    float t = u_time * 0.8;

    uv += 0.08 * vec2(
        sin(uv.y * 8.0 + t),
        cos(uv.x * 8.0 - t)
    );

    float n1 = sin(uv.x * 6.0 + t);
    float n2 = cos(uv.y * 5.0 - t);
    float n3 = sin((uv.x + uv.y) * 4.0 + t * 0.7);

    float mix1 = (n1 + n2 + n3) * 0.333;

    vec3 color = mix(
        mix(c1, c2, sin(t + uv.x * 4.0) * 0.5 + 0.5),
        mix(c3, c4, cos(t + uv.y * 4.0) * 0.5 + 0.5),
        mix1 * 0.5 + 0.5
    );

    color = mix(
        color,
        c5,
        sin(uv.x * 7.0 + uv.y * 7.0 + t) * 0.5 + 0.5
    );

    gl_FragColor = vec4(color, 1.0);
}
</script>

<script src="script.js"></script>
