<!-- SHADER -->
<script id="vertex-shader" type="x-shader/x-vertex">
attribute vec2 a_position;

void main() {
    gl_Position = vec4(a_position, 0.0, 1.0);
}
</script>

<script id="fragment-shader" type="x-shader/x-fragment">
precision mediump float;

uniform vec2 u_resolution;
uniform float u_time;

vec3 palette(float t)
{
    vec3 c1 = vec3(241.0, 90.0, 36.0) / 255.0;
    vec3 c2 = vec3(61.0, 49.0, 91.0) / 255.0;
    vec3 c3 = vec3(65.0, 182.0, 166.0) / 255.0;
    vec3 c4 = vec3(122.0, 137.0, 166.0) / 255.0;
    vec3 c5 = vec3(94.0, 130.0, 127.0) / 255.0;

    float t1 = smoothstep(0.0, 0.2, t);
    float t2 = smoothstep(0.2, 0.4, t);
    float t3 = smoothstep(0.4, 0.6, t);
    float t4 = smoothstep(0.6, 0.8, t);

    vec3 col = mix(c1, c2, t1);
    col = mix(col, c3, t2);
    col = mix(col, c4, t3);
    col = mix(col, c5, t4);

    return col;
}

float hash(vec2 p)
{
    return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453);
}

float noise(vec2 p)
{
    vec2 i = floor(p);
    vec2 f = fract(p);

    float a = hash(i);
    float b = hash(i + vec2(1.0, 0.0));
    float c = hash(i + vec2(0.0, 1.0));
    float d = hash(i + vec2(1.0, 1.0));

    vec2 u = f * f * (3.0 - 2.0 * f);

    return mix(a, b, u.x) +
           (c - a) * u.y * (1.0 - u.x) +
           (d - b) * u.x * u.y;
}

void main()
{
    vec2 uv = gl_FragCoord.xy / u_resolution.xy;
    uv -= 0.5;
    uv.x *= u_resolution.x / u_resolution.y;

    float t = u_time * 0.28;

    vec2 p = uv;

    vec2 w1 = vec2(
        noise(uv * 2.5 + t),
        noise(uv * 2.5 - t)
    );

    vec2 w2 = vec2(
        noise((uv + w1) * 3.0 + t),
        noise((uv + w1) * 3.0 - t)
    );

    p += w1 * 0.5;
    p += w2 * 0.3;

    float f =
        sin(p.x * 3.5 + t) +
        cos(p.y * 3.5 - t) +
        sin(length(p) * 4.0 + t * 0.6);

    f = f * 0.25 + 0.5;

    vec3 color = palette(f);

    color *= 0.9 + 0.1 * sin(f * 6.283 + t * 2.0);

    gl_FragColor = vec4(color, 1.0);
}
</script>
