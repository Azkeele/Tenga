<script id="vertex-shader" type="x-shader/x-vertex">
precision mediump float;

uniform vec2 u_resolution;
uniform float u_time;

vec3 palette(float t)
{
    vec3 c1 = vec3(241.0, 90.0, 36.0) / 255.0;   // #F15A24
    vec3 c2 = vec3(61.0, 49.0, 91.0) / 255.0;    // #3D315B
    vec3 c3 = vec3(65.0, 182.0, 166.0) / 255.0;  // #41B6A6
    vec3 c4 = vec3(122.0, 137.0, 166.0) / 255.0; // #7A89A6
    vec3 c5 = vec3(94.0, 130.0, 127.0) / 255.0;  // #5E827F

    return
        c1 * smoothstep(0.00, 0.20, t) * (1.0 - smoothstep(0.20, 0.25, t)) +
        c2 * smoothstep(0.20, 0.40, t) * (1.0 - smoothstep(0.40, 0.45, t)) +
        c3 * smoothstep(0.40, 0.60, t) * (1.0 - smoothstep(0.60, 0.65, t)) +
        c4 * smoothstep(0.60, 0.80, t) * (1.0 - smoothstep(0.80, 0.85, t)) +
        c5 * smoothstep(0.80, 1.00, t);
}

float field(vec2 p, float t)
{
    float v = 0.0;

    v += sin(p.x * 2.0 + t);
    v += cos(p.y * 2.0 - t);

    v += sin((p.x + p.y) * 1.5 + t * 0.7);
    v += cos(length(p) * 2.5 - t * 0.8);

    return v;
}

void main()
{
    vec2 uv = gl_FragCoord.xy / u_resolution.xy;

    uv -= 0.5;

    uv.x *= u_resolution.x / u_resolution.y;

    float t = u_time * 0.65;

    vec2 p = uv;

    for(int i = 0; i < 5; i++)
    {
        float fi = float(i);

        p += vec2(
            sin(p.y * (3.0 + fi) + t * (0.8 + fi * 0.2)),
            cos(p.x * (3.0 + fi) - t * (0.7 + fi * 0.2))
        ) * 0.12;
    }

    float n = field(p * 2.5, t);

    vec2 warp = vec2(
        sin(n + t),
        cos(n - t)
    );

    p += warp * 0.35;

    float n2 = field(p * 3.5, t * 1.2);

    float colorIndex =
        sin(n2 * 1.5) * 0.5 +
        0.5;

    colorIndex =
        smoothstep(0.0, 1.0, colorIndex);

    vec3 color = palette(colorIndex);

    float glow =
        sin(n2 * 4.0 + t * 2.0) *
        0.15 +
        0.85;

    color *= glow;

    gl_FragColor = vec4(color, 1.0);
}
</script>
