<script id="vertex-shader" type="x-shader/x-vertex">
attribute vec2 a_position;

void main() {
    gl_Position = vec4(a_position, 0.0, 1.0);
}
</script>

<script id="fragment-shader" type="x-shader/x-fragment">
precision mediump float;

uniform vec2 u_resolution;
uniform float u_time;

vec3 palette(float t)
{
    vec3 a = vec3(0.95, 0.36, 0.14);
    vec3 b = vec3(0.24, 0.19, 0.36);
    vec3 c = vec3(0.25, 0.72, 0.65);
    vec3 d = vec3(0.55, 0.60, 0.65);

    // mezcla suave pero no completamente difusa
    float t1 = smoothstep(0.0, 0.33, t);
    float t2 = smoothstep(0.33, 0.66, t);
    float t3 = smoothstep(0.66, 1.0, t);

    vec3 col = mix(a, b, t1);
    col = mix(col, c, t2);
    col = mix(col, d, t3);

    return col;
}

float hash(vec2 p)
{
    return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453);
}

float noise(vec2 p)
{
    vec2 i = floor(p);
    vec2 f = fract(p);

    float a = hash(i);
    float b = hash(i + vec2(1.0, 0.0));
    float c = hash(i + vec2(0.0, 1.0));
    float d = hash(i + vec2(1.0, 1.0));

    vec2 u = f * f * (3.0 - 2.0 * f);

    return mix(a, b, u.x) +
           (c - a) * u.y * (1.0 - u.x) +
           (d - b) * u.x * u.y;
}

void main()
{
    vec2 uv = gl_FragCoord.xy / u_resolution.xy;
    uv -= 0.5;
    uv.x *= u_resolution.x / u_resolution.y;

    float t = u_time * 0.35;

    // flujo base
    vec2 p = uv;

    // warp suave (clave del “líquido”)
    vec2 w1 = vec2(
        noise(uv * 2.0 + t),
        noise(uv * 2.0 - t)
    );

    vec2 w2 = vec2(
        noise((uv + w1) * 2.5 - t),
        noise((uv + w1) * 2.5 + t)
    );

    p += w1 * 0.35;
    p += w2 * 0.25;

    // campo continuo (NO fract → evita bloques duros)
    float f =
        sin(p.x * 3.0 + t) +
        cos(p.y * 3.0 - t) +
        sin((p.x + p.y) * 2.0 + t * 0.5);

    f = f * 0.33 + 0.5;

    vec3 color = palette(f);

    // leve contraste para que no se “aplane”
    color *= 0.9 + 0.2 * sin(f * 6.283 + t);

    gl_FragColor = vec4(color, 1.0);
}
</script>
<script src="script.js"></script>
