<script id="vertex-shader" type="x-shader/x-vertex">
attribute vec2 a_position;

void main() {
    gl_Position = vec4(a_position, 0.0, 1.0);
}
</script>

<script id="fragment-shader" type="x-shader/x-fragment">

precision mediump float;

uniform vec2 u_resolution;
uniform float u_time;

vec3 palette(float t)
{
    vec3 c1 = vec3(241.0, 90.0, 36.0) / 255.0;
    vec3 c2 = vec3(61.0, 49.0, 91.0) / 255.0;
    vec3 c3 = vec3(65.0, 182.0, 166.0) / 255.0;
    vec3 c4 = vec3(122.0, 137.0, 166.0) / 255.0;
    vec3 c5 = vec3(94.0, 130.0, 127.0) / 255.0;

    if(t < 0.20) return c1;
    if(t < 0.40) return c2;
    if(t < 0.60) return c3;
    if(t < 0.80) return c4;
    return c5;
}

void main()
{
    vec2 uv = gl_FragCoord.xy / u_resolution.xy;

    uv -= 0.5;

    uv.x *= u_resolution.x / u_resolution.y;

    float t = u_time * 1.8;

    vec2 p = uv;

    p += 0.15 * vec2(
        sin(p.y * 5.0 + t),
        cos(p.x * 4.0 - t)
    );

    p += 0.10 * vec2(
        sin(p.y * 9.0 - t * 1.3),
        cos(p.x * 8.0 + t * 1.1)
    );

    p += 0.08 * vec2(
        sin(length(p) * 12.0 + t * 1.5),
        cos(length(p) * 10.0 - t * 1.7)
    );

    float field =
          sin(p.x * 6.0 + t)
        + cos(p.y * 6.0 - t)
        + sin((p.x + p.y) * 5.0 + t)
        + cos(length(p) * 10.0 - t);

    field = field * 0.5 + 0.5;

    field = fract(field);

    vec3 color = palette(field);

    gl_FragColor = vec4(color, 1.0);
}
</script>
